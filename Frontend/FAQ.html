<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comviva FAQ</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; }

/* SIDEBAR */
.sidebar {
  width: 360px;
  background: linear-gradient(180deg, #d60805, #1e293b);
  color: white;
}

/* Hamburger */
.hamburger {
  transition: transform 0.4s ease;
}
.hamburger.rotate {
  transform: rotate(90deg);
}

/* Menu */
.menu-items {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.menu-items.show {
  max-height: 600px;
}

/* Menu buttons */
.menu-btn {
  padding: 18px 22px;
  font-size: 1.1rem;
  border-radius: 12px;
  display: block;
  transition: 0.3s;
}
.menu-btn:hover {
  background: rgba(255,255,255,0.18);
  transform: translateX(10px);
}

/* Marquee */
.marquee {
  height: 76px;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
}
.marquee span {
  padding-left: 100%;
  animation: marquee 18s linear infinite;
  font-size: 1.6rem;
  font-weight: 100;
  background: linear-gradient(90deg,#fbbf24,#ef4444,#22c55e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

/* Form */
.form-card:hover { transform: translateY(-4px); }
.input-field:focus {
  box-shadow: 0 0 0 3px rgba(249,115,22,0.3);
}
</style>
</head>

<body class="bg-orange-200 h-screen overflow-hidden">

<!-- HEADER -->
<header class="h-16 bg-white shadow flex items-center justify-between px-6">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-orange-400 rounded-full flex items-center justify-center text-white font-bold">C</div>
    <h1 class="text-xl font-bold">Comviva</h1>
  </div>
  <button class="bg-orange-500 text-white px-5 py-2 rounded-lg font-semibold hover:scale-105 transition">
    Login
  </button>
</header>

<!-- BODY -->
<div class="flex h-[calc(100vh-64px)]">

  <!-- SIDEBAR -->
  <aside class="sidebar p-6">
    <button id="hamburger" onclick="toggleMenu()"
      class="hamburger text-3xl mb-6 bg-white text-black w-14 h-14 rounded-xl shadow">
      ☰
    </button>

    <div id="menuItems" class="menu-items space-y-4">

      
      <a href="home2.html" onclick="popup('Home page')" class="menu-btn">
  🏠 Home
</a>

<a href="about.html" onclick="popup('About Comviva company')" class="menu-btn">
  ℹ️ About Us
</a>

<a href="Dashboard.html" onclick="popup('Performance metrics & analytics')" class="menu-btn">
  📊 Dashboard
</a>

<a href="Employee.html" onclick="popup('Employee directory & details')" class="menu-btn">
  👥 Employees
</a>

<a href="Project.html" onclick="popup('Ongoing & completed projects')" class="menu-btn">
  📁 Projects
</a>

<a href="clients.html" onclick="popup('Clients & partners')" class="menu-btn">
  🤝 Clients
</a>

<a href="FAQ.html" onclick="popup('Employee FAQ & support')" class="menu-btn bg-white/20">
  ❓ FAQ
</a>

    </div>
  </aside>

  <!-- RIGHT -->
  <div class="flex-1 flex flex-col">

    <!-- MARQUEE -->
    <div class="bg-black marquee">
      <span>
        ✨ Welcome to Comviva Employee Portal | HR Support: 9910173612 ✨
        Welcome to Comviva Employee Portal | HR Support: 9910173612
      </span>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-8 overflow-auto">

      <div class="form-card max-w-4xl mx-auto bg-white rounded-3xl p-12 transition">

        <h2 class="text-3xl font-bold text-center text-red-600 mb-3">
          Employee FAQ & Support
        </h2>
        <p class="text-center text-gray-500 mb-8 text-lg">
          Submit your query and our support team will assist you
        </p>

        <form class="space-y-8">
          <input class="input-field w-full px-6 py-4 border rounded-xl text-lg"
            placeholder="Employee ID" required>

          <input type="email"
            class="input-field w-full px-6 py-4 border rounded-xl text-lg"
            placeholder="Email Address" required>

          <textarea rows="5"
            class="input-field w-full px-6 py-4 border rounded-xl text-lg"
            placeholder="Describe your query..." required></textarea>

          <button class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white text-xl py-4 rounded-xl">
            🚀 Submit Query
          </button>
        </form>

      </div>

    </main>

  </div>
</div>

<script>
function toggleMenu() {
  document.getElementById('menuItems').classList.toggle('show');
  document.getElementById('hamburger').classList.toggle('rotate');
}
function popup(msg) {
  alert(msg);
}
</script>

</body>
</html>
