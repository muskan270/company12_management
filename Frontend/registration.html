<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

/* Background */
body {
  height: 100vh;
  background: linear-gradient(135deg, #0b0b0b 0%, #1a1a1a 55%, #ff8c00 100%);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Login Box */
.login-box {
  width: 580px;
  padding: 60px;
  background: #121212;
  border-radius: 22px;
  border: 1px solid rgba(255,140,0,0.4);
  box-shadow: 0 40px 80px rgba(0,0,0,0.85);
  animation: slideIn 0.8s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.login-box h2 {
  text-align: center;
  color: #ff9f1c;
  font-size: 30px;
  margin-bottom: 40px;
}

/* Input */
.form-group {
  margin-bottom: 28px;
}

label {
  display: block;
  margin-bottom: 10px;
  color: #e6e6e6;
  font-size: 15px;
}

input {
  width: 100%;
  padding: 18px;
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  transition: 0.3s;
}

input:focus {
  outline: none;
  border-color: #ff8c00;
  box-shadow: 0 0 0 2px rgba(255,140,0,0.3);
}

/* Button */
button {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, #ff8c00, #ff6a00);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 45px rgba(255,140,0,0.6);
}

/* OTP hidden initially */
#otpGroup {
  display: none;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Employee Secure Login</h2>

  <form id="loginForm">
    <div class="form-group">
      <label>Employee ID</label>
      <input type="text" id="empId" required placeholder="Enter employee ID">
    </div>

    <div class="form-group">
      <label>Email ID</label>
      <input type="email" id="email" required placeholder="Enter registered email">
    </div>

    <!-- OTP appears only after Get OTP -->
    <div class="form-group" id="otpGroup">
      <label>OTP</label>
      <input type="text" id="otp" placeholder="Enter OTP">
    </div>

    <button type="submit" id="loginBtn">Get OTP</button>
  </form>
</div>

<script>
let otpSent = false;

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  if (!otpSent) {
    // STEP 1: Send OTP
    document.getElementById("otpGroup").style.display = "block";
    document.getElementById("loginBtn").innerText = "Login";
    otpSent = true;

    alert("OTP has been sent to your email.");
  } else {
    // STEP 2: Verify OTP (backend check here)
    window.location.href = "dashboard/dashboard.html";
  }
});
</script>

</body>
</html>
