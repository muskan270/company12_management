<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comviva | Employee Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  height:100vh;
  background: linear-gradient(135deg,#050505,#0f0f0f,#050505);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}
.float-anim {
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(255,140,0,0.25), transparent 70%);
  filter: blur(50px);
  opacity:0.6;
  z-index:3;
  animation:floatMove 15s linear infinite;
}
.float-anim.one { top:10%; left:-100px; animation-delay:0s; }
.float-anim.two { top:40%; left:-150px; animation-delay:5s; }
.float-anim.three { top:70%; left:-120px; animation-delay:10s; }
@keyframes floatMove {
  0% { transform: translateX(0) translateY(0) scale(1);}
  50% { transform: translateX(120vw) translateY(-30px) scale(1.2);}
  100% { transform: translateX(240vw) translateY(0) scale(1);}
}
.brand-container{
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:30px;
  z-index:4;
  animation:fadeInDown 2s forwards;
}
@keyframes fadeInDown{
  0%{ opacity:0; transform:translate(-50%,-50px);}
  100%{ opacity:1; transform:translate(-50%,0);}
}
.logo-anim{
  width:120px;
  height:120px;
  background:linear-gradient(135deg,#ff8c00,#ff6a00);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 40px rgba(255,140,0,0.7);
  animation:rotateLogo 6s linear infinite, bounce 2s ease-in-out infinite;
}
@keyframes rotateLogo{ 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
@keyframes bounce{ 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
.company-name{
  font-size:60px;
  font-weight:800;
  color:#ff8c00;
  letter-spacing:5px;
  text-shadow:0 0 20px rgba(255,140,0,0.6);
  animation:textGlow 3s ease-in-out infinite alternate, scaleUp 2s ease-in-out infinite alternate;
}
@keyframes textGlow{
  0%{ text-shadow:0 0 10px #ff8c00,0 0 20px #ff6a00; }
  50%{ text-shadow:0 0 25px #ff8c00,0 0 50px #ff6a00; }
  100%{ text-shadow:0 0 10px #ff8c00,0 0 20px #ff6a00; }
}
@keyframes scaleUp{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.auth-box{
  width:460px;
  background: rgba(20,20,20,0.85);
  padding:50px 36px;
  border-radius:26px;
  border:1px solid rgba(255,140,0,0.35);
  box-shadow:0 40px 100px rgba(0,0,0,0.95);
  position:relative;
  z-index:5;
  backdrop-filter: blur(10px);
  transition: all 0.5s ease;
}
.auth-box:hover { transform: translateY(-5px); box-shadow:0 60px 120px rgba(255,140,0,0.5); }
.auth-box h2{
  text-align:center;
  color:#ff8c00;
  font-size:26px;
  margin-bottom:26px;
  animation:fadeIn 1s ease-in-out;
}
@keyframes fadeIn{0%{opacity:0;transform:translateY(-10px);}100%{opacity:1;transform:translateY(0);}}
.tabs{display:flex;margin-bottom:30px;background:#1a1a1a;border-radius:12px;overflow:hidden;}
.tabs button{flex:1;padding:14px;background:none;border:none;color:#aaa;cursor:pointer;font-size:15px;transition:all 0.3s;}
.tabs button.active{background:#ff8c00;color:#000;font-weight:600;box-shadow:0 4px 15px rgba(255,140,0,0.4);}
.form-group{margin-bottom:20px;position:relative;}
label{position:absolute;top:15px;left:16px;color:#777;font-size:13px;pointer-events:none;transition: all 0.3s ease;}
input:focus + label,input:not(:placeholder-shown) + label{
  top:-10px; left:12px; color:#ff8c00; font-size:11px; font-weight:600; background:rgba(11,11,11,0.85); padding:0 5px;
}
input{width:100%;padding:16px 16px;background:#181818;border:1px solid #333;border-radius:10px;color:#fff;font-size:14px;}
input:focus{outline:none;border-color:#ff8c00;box-shadow:0 0 12px rgba(255,140,0,0.45);}
.submit-btn{width:100%;padding:14px;margin-top:8px;background: linear-gradient(135deg,#ff8c00,#ff6a00);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s ease;}
.submit-btn:hover{transform: translateY(-3px) scale(1.02); box-shadow:0 15px 35px rgba(255,140,0,0.5);}
.hidden{display:none;}
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #111;
  padding: 30px 40px;
  border-radius: 14px;
  border: 2px solid #ff8c00;
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 0 30px rgba(255,140,0,0.6);
  z-index: 999;
  display: none;
}
</style>
</head>

<body>

<div class="float-anim one"></div>
<div class="float-anim two"></div>
<div class="float-anim three"></div>

<div class="brand-container">
  <div class="logo-anim"></div>
  <div class="company-name">COMVIVA</div>
  <div class="logo-anim"></div>
</div>

<div class="auth-box">
  <h2>Comviva Employee Access</h2>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Login</button>
    <button id="registerTab" onclick="showRegister()">Register</button>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <input type="text" id="loginEmpId" placeholder=" " required>
      <label>Employee ID</label>
    </div>
    <div class="form-group">
      <input type="email" id="loginEmail" placeholder=" " required>
      <label>Email ID</label>
    </div>
    <div class="form-group">
      <input type="text" id="loginOtp" placeholder=" " required>
      <label>OTP</label>
    </div>
    <button type="button" class="submit-btn" onclick="sendOtp('login')">Send OTP</button>
    <button type="submit" class="submit-btn">Login</button>
  </form>

  <form id="registerForm" class="hidden">
    <div class="form-group">
      <input type="text" id="regEmpId" placeholder=" " required>
      <label>Employee ID</label>
    </div>
    <div class="form-group">
      <input type="email" id="regEmail" placeholder=" " required>
      <label>Email ID</label>
    </div>
    <div class="form-group">
      <input type="text" id="regDept" placeholder=" " required>
      <label>Department</label>
    </div>
    <div class="form-group">
      <input type="text" id="regOtp" placeholder=" " required>
      <label>OTP</label>
    </div>
    <button type="button" class="submit-btn" onclick="sendOtp('register')">Send OTP</button>
    <button type="submit" class="submit-btn">Register</button>
  </form>
</div>

<div class="popup" id="popupMsg">Mail ID Verified</div>

<script>
const API_URL = "http://localhost:3000";

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

function showLogin(){
  loginTab.classList.add("active");
  registerTab.classList.remove("active");
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
}

function showRegister(){
  registerTab.classList.add("active");
  loginTab.classList.remove("active");
  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
}

function sendOtp(type){
  const email = type === "login"
    ? document.getElementById("loginEmail").value
    : document.getElementById("regEmail").value;

  if(!email){
    alert("Please enter email first");
    return;
  }

  fetch(`${API_URL}/send-otp`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email })
  })
  .then(res => res.json())
  .then(data => {
    if(data.message){
      alert(data.message);
    }else{
      alert("OTP sent successfully!");
    }
  })
  .catch(() => alert("Server error while sending OTP"));
}

loginForm.addEventListener("submit", function(e){
  e.preventDefault();
  const email = document.getElementById("loginEmail").value;
  const otp = document.getElementById("loginOtp").value;

  if(!otp){
    alert("Please enter OTP");
    return;
  }

  fetch(`${API_URL}/verify-otp`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email, otp })
  })
  .then(res => res.json())
  .then(data => {
    if(data.message === "OTP verified successfully"){
      showPopup("You have been verified. Logging you in...");
      setTimeout(() => window.location.href = "home1.html", 2000);
    }else{
      alert(data.message);
    }
  })
  .catch(() => alert("Server error while verifying OTP"));
});

registerForm.addEventListener("submit", function(e){
  e.preventDefault();
  const email = document.getElementById("regEmail").value;
  const otp = document.getElementById("regOtp").value;

  if(!otp){
    alert("Please enter OTP");
    return;
  }

  fetch(`${API_URL}/verify-otp`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email, otp })
  })
  .then(res => res.json())
  .then(data => {
    if(data.message === "OTP verified successfully"){
      showPopup("You have been verified. Registration successful!");
      setTimeout(() => window.location.href = "home1.html", 2000);
    }else{
      alert(data.message);
    }
  })
  .catch(() => alert("Server error while verifying OTP"));
});

function showPopup(message = "You have been verified"){
  const popup = document.getElementById("popupMsg");
  popup.textContent = message;
  popup.style.display = "block";
  setTimeout(() => popup.style.display = "none", 2000);
}
</script>
<script src="script.js"></script>

</body>
</html>
